name: Publish requested spawn test APK
on:
  push:
    branches: [arena/88ef5877-gs-samp-mobile]
    paths: ['.github/workflows/publish-spawn-test.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve the already tested APK without rebuilding
        run: |
          set -euo pipefail
          test "$(gh run view 41202279522 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 41202279522 --json headSha --jq .headSha)" = 2cf2a4188ac76dca8f725fd4754c832d922b3c8c
          gh run download 41202279522 -n asan-build-evidence -D evidence
          cd evidence
          test -s GS-SAMP-spawn-ASAN.apk
          sha256sum -c analysis/asan-apk.sha256
          echo '::notice::Original successful build APK checksum verified; no rebuild or code changes.'
      - name: Publish the test download requested by the user
        run: |
          gh release create asan-spawn-4 evidence/GS-SAMP-spawn-ASAN.apk \
            --target 2cf2a4188ac76dca8f725fd4754c832d922b3c8c \
            --prerelease --latest=false \
            --title 'Spawn diagnostic 4 — complete capability-copy coverage' \
            --notes 'Requested device-test APK from successful run 41202279522, unchanged and checksum-verified. Covers all 12 capability-copy sites. ARM64 ASan diagnostic, NOT a verified spawn stability fix. Install over the existing app without deleting data. Reports: /storage/emulated/0/GS-SAMP/asan.txt and logcat.txt. Increased memory/CPU use.'
