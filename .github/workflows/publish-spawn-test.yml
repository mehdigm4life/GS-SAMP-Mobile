name: Publish requested spawn test APK
on:
  push:
    branches: [arena/88ef5877-gs-samp-mobile]
    paths: ['.github/workflows/publish-spawn-test.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve the already tested APK without rebuilding
        run: |
          set -euo pipefail
          test "$(gh run view 41205843573 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 41205843573 --json headSha --jq .headSha)" = 2d2b75c20978cdbf23b55d313ae9ca6f227bd3c2
          gh run download 41205843573 -n asan-build-evidence -D evidence
          cd evidence
          test -s GS-SAMP-spawn-ASAN.apk
          sha256sum -c analysis/asan-apk.sha256
          echo '::notice::Original successful build APK checksum verified; no rebuild or code changes.'
      - name: Publish the test download requested by the user
        run: |
          if ! gh release create asan-spawn-7 evidence/GS-SAMP-spawn-ASAN.apk \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title 'Spawn diagnostic 7 — streaming buffer bounds repair' \
            --notes 'Requested device-test APK from successful run 41205843573, unchanged and checksum-verified. Checks actual CdStream read capacity and grows idle buffers to fit the full requested data, synchronizing workers before releasing the old allocation. Includes a regression reproducing the ASan-5 overflow and all previous player/material/control fixes. The source of the oversized request remains unconfirmed; allocation-failure recovery and device stability are not proven. ARM64 ASan diagnostic, NOT a verified spawn stability fix. Install over the existing app without deleting data. Reports: /storage/emulated/0/GS-SAMP/asan.txt and logcat.txt. Increased memory/CPU use.' >publish.log 2>&1; then
            python3 - <<'PYERR'
          from pathlib import Path
          text = Path('publish.log').read_text()
          print('::error::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYERR
            exit 1
          fi
          cat publish.log
