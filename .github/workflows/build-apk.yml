name: Build APK

# Builds the app on GitHub's runners (they have unrestricted network access to
# the Android SDK, Google Maven, Maven Central and the Gradle distribution,
# none of which are reachable from a restricted sandbox) and uploads the
# resulting APK as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    # The native (JNI) build compiles ~1100 C/C++ sources for two ABIs.
    timeout-minutes: 300

    env:
      # Bump the Gradle heap above the 2 GB set in gradle.properties.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships a complete Android SDK, so we do
      # NOT use android-actions/setup-android (it fails on these runners).
      # We only add the exact NDK / CMake / platform versions this project asks
      # for, using the sdkmanager that ships with the image.
      - name: Install SDK / NDK / CMake packages
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "SDK root: $ANDROID_HOME"
          ls "$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/platforms" || true
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Probe PRDownloader availability
        run: |
          {
            echo "artifact availability probe:"
            for u in \
              https://jitpack.io/com/github/amitshekhariitbhu/Android-PRDownloader/1.0.1/Android-PRDownloader-1.0.1.pom \
              https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/1.0.1/PRDownloader-1.0.1.pom \
              https://repo1.maven.org/maven2/com/mindorks/android/prdownloader/0.6.0/prdownloader-0.6.0.pom \
              https://repo1.maven.org/maven2/com/joom/paranoid/paranoid-gradle-plugin/0.3.14/paranoid-gradle-plugin-0.3.14.pom \
              https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/1.0.9/shadowhook-1.0.9.pom \
              https://repo1.maven.org/maven2/com/intuit/sdp/sdp-android/1.1.0/sdp-android-1.1.0.pom \
              https://repo1.maven.org/maven2/com/google/firebase/firebase-crashlytics-ndk/18.3.5/firebase-crashlytics-ndk-18.3.5.pom ; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" || echo ERR)
              echo "  $code  $u"
            done
          } | tee probe.log
          { echo '### Dependency probe'; echo '```'; cat probe.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee build.log

      # The raw Actions log is only reachable from the GitHub UI, so mirror the
      # failure tail into an issue where any API client can read it.
      # Hard gate: the whole native bootstrap lives in libsamp.so's JNI_OnLoad.
      # If it is not exported ART never calls it, the game never initialises and
      # the app quits right after launch. Never publish such an APK again.
      - name: Verify native bootstrap (JNI_OnLoad exported)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          tmp=$(mktemp -d)
          unzip -o -q "$APK" 'lib/*/libsamp.so' -d "$tmp"
          status=0
          echo '### Native bootstrap check' > verify.md
          echo '```' >> verify.md
          for so in "$tmp"/lib/*/libsamp.so; do
            abi=$(basename "$(dirname "$so")")
            line=$(readelf --dyn-syms -W "$so" | awk '$8=="JNI_OnLoad"' | head -1 || true)
            mangled=$(readelf --dyn-syms -W "$so" | awk '$8 ~ /^_Z.*JNI_OnLoad/' | head -1 || true)

            echo "$abi -> ${line:-<absent>}" | tee -a verify.md
            [ -n "$mangled" ] && echo "   (also present: $mangled)" | tee -a verify.md

            # A usable entry point must be a GLOBAL symbol with DEFAULT
            # visibility, otherwise dlsym() will not resolve it.
            if [ -n "$line" ] && echo "$line" | grep -q 'GLOBAL' && echo "$line" | grep -q 'DEFAULT'; then
              echo "OK   $abi: JNI_OnLoad is GLOBAL/DEFAULT" | tee -a verify.md
            else
              echo "FAIL $abi: JNI_OnLoad missing or not exported" | tee -a verify.md
              status=1
            fi
          done
          echo '```' >> verify.md
          cat verify.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Publish failure log as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Gradle build failed.'
            echo ''
            if [ -f probe.log ]; then echo 'Probe:'; echo '```'; cat probe.log; echo '```'; echo ''; fi
            if [ ! -f build.log ]; then echo 'build.log missing'; exit 0; fi
            echo 'Tail of the log:'
            echo ''
            echo '```'
            tail -c 30000 build.log
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build failure (run ${{ github.run_number }})" \
            --body-file /tmp/body.md || true

      # Proof that the diagnostics really moved: the constant must be present
      # in both the compiled Java (classes*.dex) and libsamp.so.
      - name: Verify diagnostics path in the APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          tmp=$(mktemp -d)
          unzip -o -q "$APK" 'classes*.dex' 'lib/*/libsamp.so' -d "$tmp"

          status=0
          { echo '### Diagnostics path check'; echo '```'; } > pathcheck.md

          dex_dir=$(strings -a "$tmp"/classes*.dex | grep -c '/storage/emulated/0/GS-SAMP' || true)
          dex_file=$(strings -a "$tmp"/classes*.dex | grep -cx 'logcat.txt' || true)
          echo "dex  : GS-SAMP dir=$dex_dir  logcat.txt=$dex_file" >> pathcheck.md
          [ "$dex_dir" -ge 1 ] && [ "$dex_file" -ge 1 ] || status=1

          for so in "$tmp"/lib/*/libsamp.so; do
            abi=$(basename "$(dirname "$so")")
            n_dir=$(strings -a "$so" | grep -c '/storage/emulated/0/GS-SAMP' || true)
            n_file=$(strings -a "$so" | grep -cx 'logcat.txt' || true)
            echo "libsamp $abi: GS-SAMP dir=$n_dir  logcat.txt=$n_file" >> pathcheck.md
            [ "$n_dir" -ge 1 ] && [ "$n_file" -ge 1 ] || status=1
          done

          android_data=$(strings -a "$tmp"/classes*.dex "$tmp"/lib/*/libsamp.so | grep -c 'Android/data' || true)
          echo "legacy Android/data references: $android_data (expected 0)" >> pathcheck.md

          echo '```' >> pathcheck.md
          cat pathcheck.md
          cat pathcheck.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Inspect APK
        if: success()
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -r | head -1)
          fi
          {
            echo '### APK verification'
            echo ''
            echo '```'
            "$AAPT2" dump badging "$APK" 2>/dev/null | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^launchable-activity" || true
            echo ''
            echo '--- native libraries ---'
            unzip -l "$APK" | grep -E "lib/[^/]+/[^/]+\.so" | awk '{printf "%10s  %s\n", $1, $4}' || true
            echo ''
            echo '--- signature files ---'
            unzip -l "$APK" | grep -E "META-INF/(CERT|.*\.RSA|.*\.SF)" | awk '{print $4}' || echo "(v2/v3 signing only)"
            echo '--- size ---'
            du -h "$APK"
            echo '```'
          } | tee apk-info.md
          { echo '### APK verification'; echo '```'; cat apk-info.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Publishing the APK as a release asset gives a stable, clickable
      # download URL instead of the ephemeral Actions artifact zip.
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::no apk produced"; exit 1; fi

          {
            echo "Automated build of commit ${GITHUB_SHA:0:7}."
            echo ''
            echo '* ABIs: armeabi-v7a + arm64-v8a'
            echo '* Signed with the standard Android debug key (installable, not for Play Store)'
            echo '* Built by GitHub Actions'
            echo ''
            cat apk-info.md
            echo ''
            [ -f verify.md ] && cat verify.md || true
            echo ''
            [ -f pathcheck.md ] && cat pathcheck.md || true
          } > release-notes.md

          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK#app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SA-MP Mobile 2.10 - build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md

      - name: Collect build report
        if: always()
        run: |
          {
            echo '### Build artifacts'
            echo ''
            find app/build/outputs -name '*.apk' 2>/dev/null | while read -r f; do
              printf -- '- `%s` (%s)\n' "$f" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            **/build/reports/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
