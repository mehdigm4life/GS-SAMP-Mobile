name: Build APK

# Builds the app on GitHub's runners (they have unrestricted network access to
# the Android SDK, Google Maven, Maven Central and the Gradle distribution,
# none of which are reachable from a restricted sandbox) and uploads the
# resulting APK as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    # The native (JNI) build compiles ~1100 C/C++ sources for two ABIs.
    timeout-minutes: 300

    env:
      # Bump the Gradle heap above the 2 GB set in gradle.properties.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships a complete Android SDK, so we do
      # NOT use android-actions/setup-android (it fails on these runners).
      # We only add the exact NDK / CMake / platform versions this project asks
      # for, using the sdkmanager that ships with the image.
      - name: Install SDK / NDK / CMake packages
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "SDK root: $ANDROID_HOME"
          ls "$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/platforms" || true
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee build.log

      # The raw Actions log is only reachable from the GitHub UI, so mirror the
      # failure tail into an issue where any API client can read it.
      - name: Publish failure log as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then echo "build.log missing"; exit 0; fi
          {
            echo 'Gradle build failed. Tail of the log:'
            echo ''
            echo '```'
            tail -c 30000 build.log
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build failure (run ${{ github.run_number }})" \
            --body-file /tmp/body.md || true

      - name: Collect build report
        if: always()
        run: |
          {
            echo '### Build artifacts'
            echo ''
            find app/build/outputs -name '*.apk' 2>/dev/null | while read -r f; do
              printf -- '- `%s` (%s)\n' "$f" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            **/build/reports/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
