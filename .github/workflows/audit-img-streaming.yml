name: Audit IMG streaming capacity
on:
  push:
    branches: [arena/88ef5877-gs-samp-mobile]
    paths: ['tools/audit_img_stream_sizes.py', '.github/workflows/audit-img-streaming.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/audit_img_stream_sizes.py
