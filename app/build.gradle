plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// ---------------------------------------------------------------------------
// Signing keystore resolution
//
// The original project pointed both build types at "../../keys/new.jks", a
// keystore that lives OUTSIDE this repository and was never committed. On a
// fresh clone that file does not exist, so Gradle refused to produce an APK --
// even for `debug`, because the debug build type was also wired to the release
// signing config.
//
// Resolution order (unchanged behaviour when the keystore is present):
//   1. ../../keys/new.jks  -> used as before, with the original credentials
//   2. otherwise           -> AGP's standard debug keystore
//                             (~/.android/debug.keystore, auto-generated on
//                             first build) so the project builds out of the box
// ---------------------------------------------------------------------------
def externalKeystore = file("../../keys/new.jks")
def useExternalKeystore = externalKeystore.exists()

if (!useExternalKeystore) {
    logger.lifecycle("Signing: ${externalKeystore} not found - falling back to the Android debug keystore.")
}

android {
    signingConfigs {
        if (useExternalKeystore) {
            debug {
                storeFile externalKeystore
                storePassword "123123"
                keyAlias "key0"
                keyPassword "123123"
            }
            release {
                storeFile externalKeystore
                storePassword "123123"
                keyAlias "key0"
                keyPassword "123123"
            }
        }
        // When the external keystore is absent, no signing config is declared
        // here so that AGP keeps its auto-generated "debug" signing config.
    }
    compileSdk 34
    allprojects {repositories {maven { url 'https://maven.aliyun.com/repository/jcenter' }}}
    namespace 'com.samp.mobile'

    defaultConfig {
        applicationId "com.samp.mobile"
        minSdk 26
        targetSdk 34
        // Bumped so builds install over the previously published APKs instead
        // of being rejected as a downgrade.
        versionCode 112
        versionName "0.8.2.8"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    ndkVersion '26.2.11394342'

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            minifyEnabled false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(useExternalKeystore ? signingConfigs.release : signingConfigs.debug)
        }
        release {
            firebaseCrashlytics {
                // Enable processing and uploading of native symbols to Firebase servers.
                // By default, this is disabled to improve build speeds.
                // This flag must be enabled to see properly-symbolicated native
                // stack traces in the Crashlytics dashboard.
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(useExternalKeystore ? signingConfigs.release : signingConfigs.debug)
        }
        all{
            multiDexEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation "com.google.android.material:material:1.3.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    testImplementation 'junit:junit:4.13.2'
    // The manifest parser uses org.json, which is only a stub in the Android
    // unit-test runtime; this supplies the real implementation so the parsing
    // rules can be tested on the JVM exactly as they ship.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // PRDownloader is no longer resolvable anywhere: 1.0.1 was published on
    // jcenter (shut down) and neither JitPack nor Maven Central serves the
    // artifact under any coordinate. app/src/main/java/com/downloader/ now
    // provides a drop-in implementation of the same API.
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    implementation 'com.google.firebase:firebase-analytics:21.2.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:18.3.5'
    implementation platform('com.google.firebase:firebase-bom:30.1.0')
    implementation 'com.google.firebase:firebase-analytics:21.2.0'
    implementation 'com.google.firebase:firebase-messaging:23.1.1'

    implementation 'org.ini4j:ini4j:0.5.4'

    implementation 'com.github.bumptech.glide:glide:4.13.0'

    implementation("androidx.lifecycle:lifecycle-process:2.2.0")

    implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"
    implementation 'com.bytedance.android:shadowhook:1.0.9'
}